[versions]
agp = "8.13.2"
kotlin = "2.2.21"
yukihookapi = "1.3.2"
dexkit = "2.2.0"
kavaref = "1.0.3"
gropify = "1.0.2"
xposed-legacy = "82"

[libraries]
yukihookapi-api = { module = "com.highcapable.yukihookapi:api", version.ref = "yukihookapi" }
libxposed-legacy = { group = "de.robv.android.xposed", name = "api", version.ref = "xposed-legacy" }
dexkit = { module = "org.luckypray:dexkit", version.ref = "dexkit" }
kavaref-core = { module = "com.highcapable.kavaref:kavaref-core", version.ref = "kavaref" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
kotlinAndroid = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
gropify = { id = "com.highcapable.gropify", version.ref = "gropify" }
