name: Build Patcher

on:
  push:
    branches: ["master"]
  workflow_dispatch:

jobs:
  build:
    permissions: write-all
    runs-on: ubuntu-latest
    env:
      KEY_STORE: ${{ secrets.KEY_STORE }}
      KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
      ALIAS: ${{ secrets.ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle
          cache-dependency-path: |
            **/*.gradle*
            **/gradle-wrapper.properties
            gradle/libs.versions.toml
            **/gradle.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: |
          if [ -n "${{ secrets.KEY_STORE }}" ]; then
            echo "${{ secrets.KEY_STORE }}" | base64 --decode > release.jks
            ./gradlew assembleRelease \
              -PandroidStoreFile=release.jks \
              -PandroidStorePassword='${{ secrets.KEY_STORE_PASSWORD }}' \
              -PandroidKeyAlias='${{ secrets.ALIAS }}' \
              -PandroidKeyPassword='${{ secrets.KEY_PASSWORD }}'
          else
            ./gradlew assembleRelease
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: WaEnhancerPatcher
          path: app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: WaEnhancer Patcher v1.0
          body: |
            ## WaEnhancer Patcher

            LSPosed module that unlocks all Pro features in WaEnhancer X.

            ### Installation
            1. Install WaEnhancer X
            2. Install WaEnhancerPatcher APK
            3. Enable module in LSPosed (scope: com.waenhancer)
            4. Reboot
          files: app/build/outputs/apk/release/app-release-unsigned.apk
          tag_name: v1.0
